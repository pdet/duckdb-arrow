name: AlignExperiment
on:
  push:
    branches:
      - regression-align-experiment

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  suite:
    name: Suite functions
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEN: ninja
      BUILD_BENCHMARK: 1
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: true
      CFLAGS: "-falign-functions=64"
      CXXFLAGS: "-falign-functions=64"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - uses: actions/checkout@v4
        with:
          path: pr
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb-nanoarrow
          ref: 6c0c36497e1cd01a46e2a5791cc7c3e53f43fc1c
          path: base
          persist-credentials: false
      - name: Checkout submodules
        run: |
          for checkout in pr base; do
            git -C "$checkout" submodule update --init --depth 1 duckdb extension-ci-tools
          done
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: align-exp-suite-functions
          max-size: 2G
      - name: Build base
        working-directory: base
        run: make release
      - name: Build PR
        working-directory: pr
        run: make release
      - name: Run regression benchmarks
        working-directory: pr
        run: |
          python3 .github/regression/run.py \
            --old ../base/build/release/benchmark/benchmark_runner \
            --new build/release/benchmark/benchmark_runner \
            --benchmarks .github/regression/micro.csv \
            --verbose \
            --early-stop \
            --threads 2
