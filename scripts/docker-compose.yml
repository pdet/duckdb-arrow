services:
  minio:
    image: quay.io/minio/minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    ports:
      - "9000:9000"
    command: ["server", "/data"]

  # Creates the test bucket once MinIO answers, then exits
  mc:
    depends_on:
      - minio
    image: quay.io/minio/mc
    entrypoint: |
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 admin password; do
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/mybucket
      "
